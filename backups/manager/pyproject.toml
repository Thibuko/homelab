[project]
name = "homelab-backup-manager"
version = "0.1.0"
description = "Unified backup manager for homelab services"
authors = [
    {name = "HomeLabUser"}
]
readme = "README.md"
requires-python = "^3.10"
dependencies = [
    "click (>=8.3.1,<9.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "docker (>=7.1.0,<8.0.0)",
    "pydantic (>=2.12.5,<3.0.0)",
]
[tool.poetry.dependencies]
python = "^3.10"
click = "^8.3.1"
pyyaml = "^6.0.3"
requests = "^2.32.5"
docker = "^7.1.0"
pydantic = "^2.12.5"


[tool.poetry.scripts]
homelab-backup = "homelab_backup_manager.main:cli"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=homelab_backup_manager --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
source = ["homelab_backup_manager"]

[tool.coverage.report]
show_missing = true
fail_under = 90

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "pylint (>=4.0.4,<5.0.0)"
]
