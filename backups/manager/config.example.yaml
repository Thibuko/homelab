global_settings:
  backup_root: "/data/backups"
  retention_days: 7
  docker_root: "/docker"
  telegram:
    token: "YOUR_TELEGRAM_BOT_TOKEN"
    chat_id: "YOUR_CHAT_ID"
    enabled: true

jobs:
  - name: homarr
    strategy: docker-compose
    service_path: "/docker/homarr"
    exclude_patterns: []

  - name: servarr
    strategy: docker-compose
    service_path: "/docker/servarr"
    exclude_patterns:
      - "**/logs"
      - "**/Backups"
      - "qbittorrent/BT_backup"

  - name: npm
    strategy: docker-compose
    service_path: "/docker/npm"

  - name: immich
    strategy: postgres-dump
    container_name: immich_postgres
    db_user: postgres

  - name: pihole
    strategy: command
    container_name: pihole
    dump_command: "pihole-FTL --teleporter"
